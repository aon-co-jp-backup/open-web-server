[workspace]
resolver = "2"
members = [
    "crates/open-web-server-core",
    "crates/open-web-server-wire",
    "crates/open-web-server-ledger",
    "crates/open-web-server-gateway",
    "crates/open-web-server-ios-bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
http = "1"
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# 第1層: 伝送路暗号化 (TLS)
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2"
rustls-pki-types = "1"

# 第2層: 相互認証
rand = "0.10"
subtle = "2"
hmac = "0.13"

# 第3層: アプリケーション層ペイロード暗号化
chacha20poly1305 = "0.11"
hkdf = "0.13"
sha2 = "0.11"

# 連携先クライアント
# default-features=falseでnative-tls(OpenSSL、Androidクロスビルドで
# openssl-sysのネイティブビルド失敗の原因になっていた)を無効化し、
# 既存方針通りrustls(pure Rust実装)に統一する(2026-07-23、Android版
# クロスコンパイル検証で発覚)。
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "rustls", "charset", "http2", "system-proxy"] }

# 通信層の四重化 第3伝送路: QUIC (Multipath QUICへの拡張余地を残した第一実装)
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "log"] }
rcgen = "0.14"

# ACMEクライアント(JWS署名用、rustlsが既に推移依存として引くring 0.17と
# バージョンを合わせて明示的な直接依存にする)
ring = "0.17"

# DB書き込みの四重化 第1永続化先: PostgreSQL (ACIDトランザクション保証)
# + 第3永続化先: マルチリージョン同期レプリケーション (sqliteをリージョン代替として使用)
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "sqlite", "chrono", "uuid"] }

# 可観測性 (OpenTelemetry)
opentelemetry = { version = "0.33", features = ["trace"] }
opentelemetry_sdk = { version = "0.33", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["http-proto", "reqwest-blocking-client"] }
opentelemetry-stdout = { version = "0.33", features = ["trace"] }
tracing-opentelemetry = "0.34"

# RUSTSEC-2023-0071 (rsa Marvin Attack, 修正版なし) 回避: aon-co-jp/rsa-rs の互換実装へ差し替え。
[patch.crates-io]
rsa = { git = "https://github.com/aon-co-jp/rsa-rs", tag = "v0.1.0", version = "=0.10.0-rc.18" }
rsa-090 = { package = "rsa", git = "https://github.com/aon-co-jp/rsa-rs", tag = "v0.1.0", version = "=0.9.10" }
