name: Production build (admin-2fa)

# 本番VPS(AlmaLinux)向けの open-web-server を、本番と同じfeature一式 +
# `admin-2fa` でビルドする(docs/admin-2fa-design.md §5)。
#
# - VPSはメモリに余裕が無いため、VPS上ではビルドしない。ここでビルドして
#   成果物(+SHA-256)をArtifactとして受け取り、scp等で置く。
# - 公式リリース(release.yml)はfeature無しのままなので流用しない。
# - 本番へ置く手順・差し替え・ロールバックは docs/admin-2fa-design.md §8。
#
# **feature一式について**: 稼働中の本番バイナリの目印文字列を比較して確認した
# 結果(acme と upnp は含まれず、ddns・fastcgi・sftp・watchdog は含まれる)に
# 合わせ、`admin-2fa,domain-watchdog,fastcgi-client,ddns,sftp` とする。
# acme を入れると、本番のWATCHDOG_ACME_CONTACT_EMAIL設定により監視機能が
# ACME証明書を自動取得し、certbot運用と衝突する恐れがあるため外している。
# `auto-update` も意図的に含めない(有効だと公式リリースのfeature無し
# バイナリで上書きされる危険があるため)。

on:
  workflow_dispatch: {}
  push:
    branches:
      - admin-2fa-hardening

permissions:
  contents: read

env:
  PROD_FEATURES: "admin-2fa,domain-watchdog,fastcgi-client,ddns,sftp"

jobs:
  build:
    name: Build (ubuntu-latest, glibc 2.39) and verify on AlmaLinux 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # open-web-server-wire が RS-SmartTCP を path 依存(../RS-SmartTCP)で参照。
      - name: Checkout RS-SmartTCP (sibling path dependency)
        run: git clone --depth=1 https://github.com/aon-co-jp/RS-SmartTCP.git ../RS-SmartTCP
      # open-web-server-ledger が open-raid-z を optional path 依存で参照
      # (使わなくてもマニフェストの解決に必要)。
      - name: Checkout open-raid-z (sibling path dependency)
        run: git clone --depth=1 https://github.com/aon-co-jp/open-raid-z.git ../open-raid-z
      # open-raid-z/zfs_accel_hlsl(RS-SmartTCP経由)が open-cpu を path 依存で参照。
      - name: Checkout open-cpu (sibling path dependency)
        run: git clone --depth=1 https://github.com/aon-co-jp/open-cpu.git ../open-cpu
      - uses: Swatinem/rust-cache@v2

      - name: Test (production features)
        run: cargo test -p open-web-server-gateway --features "$PROD_FEATURES"

      - name: Build
        run: cargo build --release -p open-web-server-gateway --bin open-web-server --features "$PROD_FEATURES"

      - name: Package (binary + SHA-256)
        run: |
          mkdir -p dist
          cp target/release/open-web-server dist/open-web-server
          strip dist/open-web-server
          (cd dist && sha256sum open-web-server | tee open-web-server.sha256)
          # 要求するglibcシンボルの最大バージョンを記録する。
          objdump -T dist/open-web-server | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1 | tee dist/max-glibc.txt
          # admin-2fa が実際に入っていることの確認(feature無しではこのログ文言が無い。ルートのパス文字列は最適化で連続文字列にならない)。
          grep -c 'failed to send admin login OTP email' dist/open-web-server | tee dist/admin-2fa-marker-count.txt
          test "$(cat dist/admin-2fa-marker-count.txt)" -ge 1

      - name: Verify feature set (acme / upnp absent, x-tls-token present)
        run: |
          set +e
          acme=$(grep -c -a 'tls/acme' dist/open-web-server)
          upnp=$(grep -c -a 'upnp' dist/open-web-server)
          tls=$(grep -c -a 'x-tls-token' dist/open-web-server)
          echo "tls/acme=$acme upnp=$upnp x-tls-token=$tls"
          test "$acme" -eq 0 && test "$upnp" -eq 0 && test "$tls" -ge 1

      - name: Verify the binary starts on AlmaLinux 10 (本番OSの互換確認)
        run: |
          docker run --rm -v "$PWD/dist:/w:ro" almalinux:10 bash -c '
            cat /etc/almalinux-release; ldd --version | head -1
            ldd /w/open-web-server
            /w/open-web-server --version
          '

      - uses: actions/upload-artifact@v4
        with:
          name: open-web-server-prod-admin-2fa-linux-x86_64
          path: |
            dist/open-web-server
            dist/open-web-server.sha256
            dist/max-glibc.txt
          retention-days: 14
